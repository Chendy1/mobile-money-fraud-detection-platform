name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,eda,ml,explain,tracking,api,dashboard]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Secret scan
        run: python -m mmrisk.security scan
      - name: Test
        run: pytest --cov=src --cov-report=term-missing

  dependency-audit:
    # Reports known vulnerabilities in what the project installs. It does not fail the build:
    # most findings are in transitive packages the project cannot fix on its own (see
    # docs/security.md). Read the log.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[serve,dashboard,tracking]" pip-audit
      - run: pip-audit --skip-editable

  docker-build:
    # Builds the API image (nothing is pushed) and checks what the unit tests cannot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t mmrisk-api:ci .
      - name: LightGBM imports (needs the OpenMP runtime) and the CLI starts
        run: |
          docker run --rm --entrypoint python mmrisk-api:ci -c "import lightgbm, sklearn, fastapi, polars"
          docker run --rm --entrypoint python mmrisk-api:ci -m mmrisk.api --help
      - name: The image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id mmrisk-api:ci -u)" = "10001"
      - name: The compose file is valid
        run: docker compose config -q
