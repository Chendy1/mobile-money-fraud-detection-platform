# Prometheus for the production-like stack (Phase 20): the API now needs a key and speaks TLS.
# The key is a file of its own (secrets/metrics_key, a key with the `metrics` role: it can read
# /metrics and nothing else). The certificate is the API's own self-signed one, trusted by file.
# Not run by the assistant (no Docker in its sandbox): TO VERIFY.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: mmrisk-api
    metrics_path: /metrics
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_key
    tls_config:
      ca_file: /run/secrets/tls_cert
      server_name: api
    static_configs:
      - targets: ["api:8443"]
