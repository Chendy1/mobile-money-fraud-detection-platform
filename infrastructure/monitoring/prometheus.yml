# Prometheus for the local scoring API. Opt-in: docker compose --profile monitoring up
# Alerts are evaluated here and shown in the Prometheus and Grafana UIs. There is no Alertmanager,
# so nothing is sent to anyone; a real deployment would add one (TO VERIFY in a later phase).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: mmrisk-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
