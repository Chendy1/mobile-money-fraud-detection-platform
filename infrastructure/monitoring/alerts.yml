# Alert rules. Every threshold is an ASSUMPTION for a synthetic local simulation (measured in the
# sandbox: scorer p95 about 7 ms, about 2.8% of transactions flagged). Set real ones from real
# traffic. Metric names are checked against the API's own list by tests/unit/test_monitoring_*.
groups:
  - name: mmrisk-api
    rules:
      - alert: ApiDown
        expr: up{job="mmrisk-api"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: The scoring API cannot be scraped
      - alert: ApiNotReady
        expr: mmrisk_service_ready == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: The API is up but has no model loaded
      - alert: HighServerErrorRate
        expr: >
          sum(rate(mmrisk_http_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(mmrisk_http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: More than 5% of requests fail on the server side
      - alert: HighInvalidRequestRate
        expr: >
          sum(rate(mmrisk_http_requests_total{endpoint="/v1/score",status="422"}[5m]))
          / clamp_min(sum(rate(mmrisk_http_requests_total{endpoint="/v1/score"}[5m])), 1e-9) > 0.2
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: More than 20% of scoring requests are rejected as invalid
      - alert: HighScoringLatency
        expr: >
          histogram_quantile(0.95, sum by (le) (
          rate(mmrisk_http_request_duration_seconds_bucket{endpoint="/v1/score"}[5m]))) > 0.25
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: The 95th percentile scoring time is above 250 ms
  - name: mmrisk-decisions
    rules:
      - alert: FlaggedShareHigh
        expr: >
          (sum(increase(mmrisk_transactions_scored_total{action!="ALLOW"}[1h]))
          / clamp_min(sum(increase(mmrisk_transactions_scored_total[1h])), 1)) > 0.08
          and sum(increase(mmrisk_transactions_scored_total[1h])) >= 200
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: More than 8% of scored transactions were flagged over the last hour
      - alert: FlaggedShareZero
        expr: >
          sum(increase(mmrisk_transactions_scored_total{action!="ALLOW"}[6h])) == 0
          and sum(increase(mmrisk_transactions_scored_total[6h])) >= 500
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: Nothing was flagged in 6 hours of traffic, which the model should not produce
