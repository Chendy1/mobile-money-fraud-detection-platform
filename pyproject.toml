[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmrisk"
version = "0.1.0"
description = "M-Pesa-inspired mobile-money transaction risk scoring platform (synthetic data only)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Clyde Adili" }]
# Runtime dependencies are added phase by phase, only when first needed.
dependencies = ["numpy>=1.26", "polars>=1.0"]

[project.scripts]
mmrisk-generate = "mmrisk.generation.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyyaml>=6", "promql-parser>=0.4", "cryptography>=42",
    "python-hcl2>=4",
]
# exploratory analysis and reporting (Phase 5)
eda = ["duckdb>=1.0", "matplotlib>=3.8"]
# baseline models and evaluation (Phase 7)
ml = ["scikit-learn>=1.4", "lightgbm>=4.0", "matplotlib>=3.8"]
# cross-check of the exact tree explanations against the SHAP library (Phase 9, tests only)
explain = ["shap>=0.45"]
# experiment tracking in a local store (Phase 10); the pipeline also runs without it
tracking = ["mlflow>=2.14"]
# local scoring API (Phase 11); httpx is for the test client
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "prometheus-client>=0.20"]
# local dashboard (Phase 17); read-only, runs on this computer only
dashboard = ["streamlit>=1.40"]
# what the dashboard container installs: the page plus the registry reader, which imports the model bundle (scikit-learn brings joblib)
dashboard-image = ["streamlit>=1.40", "scikit-learn>=1.4"]
# the smallest set that can serve a saved model (the container image installs only this)
serve = [
    "scikit-learn>=1.4", "lightgbm>=4.0", "fastapi>=0.110", "uvicorn>=0.29", "prometheus-client>=0.20",
]
# the production-like deployment commands (Phase 20): the TLS certificate and the compose file reader,
# plus everything in `serve`, because preflight loads the model and parses the API's command line and
# verify imports the API package. Keep this a superset of `serve` (a test checks it).
deploy = [
    "cryptography>=42", "pyyaml>=6",
    "scikit-learn>=1.4", "lightgbm>=4.0", "fastapi>=0.110", "uvicorn>=0.29", "prometheus-client>=0.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "training", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The report builders are mostly long prose strings; formatting still applies.
"src/mmrisk/models/advanced_report.py" = ["E501"]
"src/mmrisk/models/explain_report.py" = ["E501"]
"src/mmrisk/models/model_card.py" = ["E501"]
"src/mmrisk/demo/steps.py" = ["E501"]  # the talking points are prose
