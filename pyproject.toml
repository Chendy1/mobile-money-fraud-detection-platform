[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmrisk"
version = "0.1.0"
description = "M-Pesa-inspired mobile-money transaction risk scoring platform (synthetic data only)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Clyde Adili" }]
# Runtime dependencies are added phase by phase, only when first needed.
dependencies = ["numpy>=1.26", "polars>=1.0"]

[project.scripts]
mmrisk-generate = "mmrisk.generation.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
# exploratory analysis and reporting (Phase 5)
eda = ["duckdb>=1.0", "matplotlib>=3.8"]
# baseline models and evaluation (Phase 7)
ml = ["scikit-learn>=1.4", "lightgbm>=4.0", "matplotlib>=3.8"]
# cross-check of the exact tree explanations against the SHAP library (Phase 9, tests only)
explain = ["shap>=0.45"]
# experiment tracking in a local store (Phase 10); the pipeline also runs without it
tracking = ["mlflow>=2.14"]
# local scoring API (Phase 11); httpx is for the test client
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "training", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The report builders are mostly long prose strings; formatting still applies.
"src/mmrisk/models/advanced_report.py" = ["E501"]
"src/mmrisk/models/explain_report.py" = ["E501"]
"src/mmrisk/models/model_card.py" = ["E501"]
