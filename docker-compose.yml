# Local scoring API. Needs a trained model and the data lake on the host first:
#   .\scripts\dev.ps1 advanced    (or pipeline)  -> models\advanced
#   data\processed from the ingestion step
# Run:  docker compose up --build        Check:  python -m mmrisk.api smoke
name: mmrisk

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mmrisk-api:local
    # Published on the host's loopback address only: nothing on the network can reach it.
    # The API has no authentication or TLS (Phase 18), so do not change this to 0.0.0.0.
    ports:
      - "127.0.0.1:8000:8000"
    # The model and the lake are mounted read-only; they are not part of the image.
    # The model file is a pickle: mount only a folder this project created.
    volumes:
      - ./models/advanced:/app/models/advanced:ro
      - ./data/processed:/app/data/processed:ro
    # To replay only part of the history, add flags after the image's own command, for example:
    # command: ["python", "-m", "mmrisk.api", "serve", "--host", "0.0.0.0", "--allow-external",
    #           "--model-dir", "/app/models/advanced", "--lake", "/app/data/processed",
    #           "--history-until", "2025-12-01"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Measured natively: about 290 MB with no history and about 530 MB peak with 200,000
    # transactions replayed (about 1.2 KB per transaction). Raise this for a larger lake.
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    restart: "no"
    # With STREAM_FROM set, the API replays only the history before that time, so that the
    # simulator (below) can stream everything from that time on. Unset, it replays everything.
    environment:
      MMRISK_HISTORY_UNTIL: ${STREAM_FROM:-}

  # Event simulator (Phase 13): streams lake transactions from STREAM_FROM through a bounded queue
  # into the API over HTTP and appends the predictions to ./data/predictions. Not started by
  # default. Run (create the folder first; restart the API between runs, because it keeps what it
  # has scored in memory):
  #   mkdir data\predictions
  #   $env:STREAM_FROM = "2025-12-24T00:00:00"
  #   docker compose --profile simulate up --build
  simulator:
    profiles: ["simulate"]
    build:
      context: .
      dockerfile: Dockerfile
    image: mmrisk-api:local
    depends_on:
      api:
        condition: service_healthy
    command:
      - python
      - -m
      - mmrisk.streaming
      - run
      - --url
      - http://api:8000
      - --lake
      - /app/data/processed
      - --from
      - ${STREAM_FROM:-}
      - --store
      - /app/data/predictions
      - --limit
      - "5000"
      - --duplicate-rate
      - "0.01"
      - --bad-rate
      - "0.005"
      - --jitter-seconds
      - "20"
      - --max-lateness
      - "60"
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./data/predictions:/app/data/predictions
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    restart: "no"

  # Monitoring (Phase 14). Opt-in:  $env:GRAFANA_ADMIN_PASSWORD = "<choose one>"
  #                                 docker compose --profile monitoring up --build
  # Prometheus http://127.0.0.1:9090 scrapes the API's /metrics; Grafana http://127.0.0.1:3000
  # (user admin, the password above) shows a provisioned dashboard. Both are published on the
  # loopback address only. Images are pinned tags, not digests, and none of this has been run by
  # the assistant (Docker Hub is not reachable from its sandbox): TO VERIFY.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64
    restart: "no"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.3.0
    depends_on:
      - prometheus
    # No default password: it must be provided, so none is stored in this file or the image.
    entrypoint:
      - sh
      - -c
      - 'test -n "$$GF_SECURITY_ADMIN_PASSWORD" || { echo "set GRAFANA_ADMIN_PASSWORD first" >&2; exit 1; }; exec /run.sh'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    restart: "no"

volumes:
  prometheus-data:
  grafana-data:
